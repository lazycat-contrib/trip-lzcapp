application:
  subdomain: trip
  background_task: true
  multi_instance: false
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://trip:8000/

services:
  trip:
    # upstream: ghcr.io/itskovacs/trip:1.50.1
    image: ghcr.1ms.run/itskovacs/trip:1.50.1
    command: ["fastapi", "run", "/app/trip/main.py", "--host", "0.0.0.0", "--port", "8000"]
    binds:
      - /lzcapp/var/trip:/app/storage
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/info', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
