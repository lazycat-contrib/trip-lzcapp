version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/trip.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: trip

build:
  run_buildscript: false

images:
  - id: trip
    target: service
    service: trip
    source: ghcr.io/itskovacs/trip
    channel: custom
    sort: semver
    tag_regex: '^\d+(\.\d+){1,2}$'
    version_regex: '^(\d+)\.(\d+)(?:\.(\d+))?$'
    version_template: '{{.version}}.0'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Trip
    summary: "极简 POI 地图追踪与行程规划"
